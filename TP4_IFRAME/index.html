<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Découverte des Iframes</title>
  </head>
  <body>
    <h1>Découverte des Iframes</h1>
    <nav>
      <a href="pages/contact.html">Contact</a>
    </nav>
    <p>
      Une iframe permet d'intégrer un autre contenu à l'intérieur d'une page
      Web.
    </p>
    <h2>une page integree</h2>
    <!-- <iframe src="https://www.github.com" width="800" height="400" title="Page web inegree"></iframe> -->
    <!-- <iframe
      src="https://www.github.com"
      width="500"
      height="300"
      title="exemple"
    ></iframe> -->
    <iframe
      src="https://www.github.com"
      width="100%"
      height="400"
      title="Exemple"
    ></iframe>
    <section>
      <h3>Vidéo sur le développement Web</h3>
<iframe width="560" height="315" src="https://www.youtube.com/embed/ANgz45AOsDg?si=vCSm-p2L4wxrBYK9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </iframe>
    </section>
    <section>
      <h2>Notre localisation</h2>
      <iframe src="erl de carte" width="600" height="450" title="Localisation">
      </iframe>
    </section>
    <main>
      <section>
        <h2>Présentation</h2>
        <p>Découvrez notre établissement et nos activités</p>
      </section>
      <section>
        <h2>Vidéo</h2>
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/VIDEO_ID"
          title="Présentation vidéo"
          allowfullscreen
        >
        </iframe>
      </section>
      <section>
        <h2>Localisaion</h2>
        <iframe
          src="URL_DE_LA_CARTE"
          width="600"
          height="400"
          style="border: 0"
          title="Carte">
        </iframe>
      </section>
    </main>
  </body>
</html>
